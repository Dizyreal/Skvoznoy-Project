x-airflow-common:
  &airflow-common
  image: apache/airflow:2.10.0
  environment:
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
    AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
    AIRFLOW__WEBSERVER__RBAC: 'true'
    _PIP_ADDITIONAL_REQUIREMENTS: pandas sqlalchemy psycopg2-binary pyyaml requests
  volumes:
    - ./dags:/opt/airflow/dags
    - ./configs:/opt/airflow/configs
    - ./data:/opt/airflow/data
    - ./reference:/opt/airflow/reference
    - ./src:/opt/airflow/src
    - ./scripts:/opt/airflow/scripts
  depends_on:
    - postgres
  logging:
    options:
      max-size: "10m"
      max-file: "3"

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    ports:
      - "5433:5432"
    volumes:
      - postgres-db-volume:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 5s
      retries: 5

  webserver:
    <<: *airflow-common
    command: webserver
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 10s
      timeout: 10s
      retries: 5

  scheduler:
    <<: *airflow-common
    command: scheduler
    healthcheck:
      test: ["CMD", "airflow", "jobs", "check", "--job-type", "SchedulerJob"]
      interval: 10s
      timeout: 10s
      retries: 5

volumes:
  postgres-db-volume: