x-airflow-common: &airflow-common
  image: apache/airflow:2.10.0
  environment:
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://student:student_pw@postgres/airflow
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
    AIRFLOW__WEBSERVER__SECRET_KEY: 'skvoznoy-secret-key-change-in-prod'
    _PIP_ADDITIONAL_REQUIREMENTS: pandas sqlalchemy psycopg2-binary pyyaml requests scikit-learn
  volumes:
    - ./dags:/opt/airflow/dags
    - ./configs:/opt/airflow/configs
    - ./data:/opt/airflow/data
    - ./reference:/opt/airflow/reference
    - ./src:/opt/airflow/src
    - ./scripts:/opt/airflow/scripts
  logging:
    options:
      max-size: "10m"
      max-file: "3"

services:
  # ── Shared PostgreSQL (airflow metadata + analytics data) ─────────────────
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: student
      POSTGRES_PASSWORD: student_pw
      POSTGRES_DB: analytics
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U student -d analytics"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── Airflow bootstrap: creates airflow DB, migrates schema, admin user ────
  airflow-init:
    <<: *airflow-common
    entrypoint: /bin/bash
    command: ["/opt/airflow/scripts/airflow_init.sh"]
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy

  # ── Airflow Webserver  (http://localhost:8080  admin/admin) ───────────────
  airflow-webserver:
    <<: *airflow-common
    command: webserver
    ports:
      - "8080:8080"
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # ── Airflow Scheduler ────────────────────────────────────────────────────
  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  # ── Metabase BI  (http://localhost:3000) ─────────────────────────────────
  metabase:
    image: metabase/metabase:latest
    ports:
      - "3000:3000"
    volumes:
      - metabase_data:/metabase-data
    environment:
      MB_DB_FILE: /metabase-data/metabase.db
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
  metabase_data:
